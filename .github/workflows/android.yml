name: Build & Release (Android)

# Budowanie i wydanie wyłącznie po wypchnięciu tagu wersji (np. v1.2.3).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.ver.outputs.base }}
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wersja
        id: ver
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          NAME="$BASE"
          CODE=$(( ${{ github.run_number }} + 100 ))
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Bez sekretu APK podpisuje się kluczem debug – nadal się instaluje, ale aktualizacja
      # „na wierzch” wymaga tego samego klucza, więc wydania produkcyjne potrzebują sekretu.
      - name: Klucz podpisu
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Testy jednostkowe
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Budowanie APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle :app:assembleRelease :wear:assembleRelease -PversionCode=${{ needs.version.outputs.code }} -PversionName=${{ needs.version.outputs.name }} --stacktrace

      # Dwa pliki: telefon i – podpisany tym samym kluczem – zegarek Wear OS.
      - name: Przygotowanie plików
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OpenDial-${{ needs.version.outputs.name }}.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "OpenDial-Watch-${{ needs.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDial-${{ needs.version.outputs.name }}-android
          path: |
            OpenDial-${{ needs.version.outputs.name }}.apk
            OpenDial-Watch-${{ needs.version.outputs.name }}.apk

  release:
    needs: [version, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Opis wydania to sekcja z CHANGELOG.md dla danej wersji; aplikacja pokazuje go
      # w powiadomieniu o aktualizacji, ucinając wszystko po „---”.
      - name: Publikacja wydania
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.version.outputs.name }}
          BASE: ${{ needs.version.outputs.base }}
        run: |
          TAG="v$NAME"
          NOTES=$(awk -v version="$BASE" '$0 == "## " version { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          if [ "$NAME" != "$BASE" ]; then
            LOG=$(git log -5 --pretty='- %s' "$GITHUB_SHA")
            NOTES=$(printf 'Poprawki i ulepszenia:\n\n%s' "$LOG")
          fi
          FOOTER=$(printf -- '---\nPobierz **OpenDial-%s.apk** i zainstaluj na telefonie (Android 10+). Kolejne wersje aplikacja pobierze sama.\n\nZegarek Wear OS: **OpenDial-Watch-%s.apk** – plik dla zegarka, instalowany przez `adb` (nieobowiązkowy).' "$NAME" "$NAME")
          gh release create "$TAG" "dist/OpenDial-$NAME.apk" "dist/OpenDial-Watch-$NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "OpenDial $NAME" \
            --notes "$(printf '%s\n\n%s' "$NOTES" "$FOOTER")" \
            --latest
